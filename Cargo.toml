[workspace]
members = [
    # The ContainerRaceFuzz engine and its two companions.
    "scheds/experimental/scx_crfuzz",
    "scheds/experimental/scx_crfuzz_gate",
    "scheds/experimental/scx_crfuzz_gen",

    # Upstream scx crates retained because the three above need them:
    # scx_crfuzz_gate depends on scx_utils (runtime) and scx_cargo (BPF build),
    # and scx_utils in turn depends on scx_stats.
    "rust/scx_cargo",
    "rust/scx_stats",
    "rust/scx_stats/scx_stats_derive",
    "rust/scx_utils",
]
resolver = "2"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = true
lto = false
