[package]
name = "scx_crfuzz"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"

# The gate's BPF only builds on Linux; elsewhere the crate builds without it
# (spec §3.1).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libbpf-rs = "=0.27.2"
scx_utils = "=1.1.4"

[target.'cfg(target_os = "linux")'.build-dependencies]
scx_cargo = "=1.1.4"
# Only for its compiler lookup: build.rs links the static mutator itself.
cc = "1"
