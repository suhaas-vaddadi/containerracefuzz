[package]
name = "scx_crfuzz"
version = "0.1.0"
edition = "2021"
description = "ContainerRaceFuzz: a deterministic replay and race-discovery scheduling engine for container runtime TOCTOU bugs."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
log = "0.4"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# Linux-only. The engine, policies, role algebra and log are pure Rust and
# test on any host; only the backend that actually holds a process needs a
# kernel. Keeping these behind a target cfg is what preserves that.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libseccomp = "0.4"
nix = { version = "0.29", features = ["fs", "poll", "process", "signal", "socket", "uio"] }
scx_crfuzz_gate = { path = "../scx_crfuzz_gate", version = "0.1.0" }
