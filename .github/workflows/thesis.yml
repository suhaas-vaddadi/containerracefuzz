name: thesis
on:
  push:
    paths: ['thesis/**', '.github/workflows/thesis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: main.tex
      # Every run: downloadable from the run's Summary page.
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/main.pdf
      # main only: replace the thesis-pdf release so the README link serves the latest build.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete thesis-pdf --yes --cleanup-tag || true
          gh release create thesis-pdf thesis/main.pdf --target "$GITHUB_SHA" \
            --title "Thesis PDF (latest)" --notes "Built from $GITHUB_SHA"
